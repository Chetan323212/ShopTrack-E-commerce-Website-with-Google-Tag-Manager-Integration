services:
  - type: web
    name: aura-ecommerce-platform
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ADMIN_EMAIL
        value: admin@aura.store
      - key: ADMIN_PASSWORD
        value: Admin@123456
      - key: VITE_GTM_ID
        value: GTM-5NVCVF96
      - key: VITE_GA4_MEASUREMENT_ID
        value: G-AURA99TEST
